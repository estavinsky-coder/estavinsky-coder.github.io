<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>פיזיולוגיה של המאמץ – שיעורים 1-3</title>
<style>
:root{
  --bg:#f6f5f2; --surface:#ffffff; --surface-2:#f0eee9; --ink:#1f2328; --ink-2:#4a5059; --muted:#7a808a;
  --line:#e2dfd8; --accent:#1f4e79; --accent-soft:#e7eef6; --good:#2f6f4f; --good-soft:#e6f2ec;
  --bad:#9b2c2c; --bad-soft:#f8e9e9; --note:#7a5a12; --note-soft:#fbf4e3;
  --radius:10px; --shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181c; --surface:#1e2126; --surface-2:#262a30; --ink:#e7e9ec; --ink-2:#b9bec6; --muted:#8a919b;
    --line:#33383f; --accent:#7fb0e0; --accent-soft:#1f2c3a; --good:#7cc5a0; --good-soft:#1c2e26;
    --bad:#e59595; --bad-soft:#3a2224; --note:#e2c27a; --note-soft:#332b1a; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#16181c; --surface:#1e2126; --surface-2:#262a30; --ink:#e7e9ec; --ink-2:#b9bec6; --muted:#8a919b;
  --line:#33383f; --accent:#7fb0e0; --accent-soft:#1f2c3a; --good:#7cc5a0; --good-soft:#1c2e26;
  --bad:#e59595; --bad-soft:#3a2224; --note:#e2c27a; --note-soft:#332b1a; --shadow:none;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Assistant","Heebo",Arial,sans-serif;font-size:17px;line-height:1.75;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
b{font-weight:650;color:var(--ink)}
sub,sup{line-height:0}

/* header */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;padding:14px 16px 0}
.title-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.2px}
.sub{color:var(--muted);font-size:14px}
.theme-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:13px;color:var(--ink-2)}
nav.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:10px 14px;font-size:15px;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.progress{height:3px;background:var(--line);margin-top:-1px}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

/* layout */
.wrap{max-width:1200px;margin:0 auto;padding:24px 16px 80px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:32px}
.panel[hidden]{display:none!important}
.wrap.single{grid-template-columns:minmax(0,1fr);max-width:820px}
aside.toc{position:sticky;top:130px;align-self:start;max-height:calc(100vh - 150px);overflow:auto;font-size:14px;padding-left:4px}
.toc h4{margin:18px 0 6px;font-size:12px;letter-spacing:.6px;color:var(--muted);font-weight:600}
.toc h4:first-child{margin-top:0}
.toc a{display:flex;gap:8px;align-items:flex-start;padding:5px 10px;border-radius:6px;color:var(--ink-2);text-decoration:none;line-height:1.45;border-right:2px solid transparent}
.toc a:hover{background:var(--surface-2)}
.toc a.on{color:var(--accent);border-right-color:var(--accent);background:var(--accent-soft)}
.toc a .dot{flex:none;width:7px;height:7px;border-radius:50%;margin-top:7px;border:1.5px solid var(--muted)}
.toc a.done .dot{background:var(--good);border-color:var(--good)}
.toc-mobile{display:none;margin-bottom:16px}
.toc-mobile select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px}

main{min-width:0;max-width:780px}
.intro{color:var(--ink-2);margin:0 0 28px;font-size:17px}
.lesson-head{margin:40px 0 16px;padding-bottom:8px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:12px}
.lesson-head:first-of-type{margin-top:0}
.lesson-head span{font-size:13px;color:var(--accent);font-weight:600;letter-spacing:.5px}
.lesson-head h2{margin:0;font-size:21px}

/* section card */
section.topic{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;margin:0 0 18px;box-shadow:var(--shadow)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.kind{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.5px}
.kind::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-left:6px;background:var(--k,var(--muted));vertical-align:1px}
.k-definition{--k:#3b6ea5}.k-rule{--k:#b5672b}.k-formula{--k:#6b4fa3}.k-example{--k:#2f7d5b}.k-fact{--k:#2a7c86}.k-text{--k:#8a7a3a}
section.topic h3{margin:0 0 14px;font-size:20px;line-height:1.4}
.markdone{border:1px solid var(--line);background:none;border-radius:6px;font-size:12.5px;padding:3px 9px;color:var(--muted)}
.markdone.on{color:var(--good);border-color:var(--good);background:var(--good-soft)}
.body{color:var(--ink)}
figure{margin:16px 0;text-align:center}
figure img{max-width:100%;border:1px solid var(--line);border-radius:8px;cursor:zoom-in;background:#fff}
figure svg{width:100%;max-width:380px;height:auto}
figcaption{font-size:13px;color:var(--muted)}
.box{border-radius:8px;padding:12px 16px;margin:14px 0 0;font-size:16px;border-right:3px solid}
.box .lbl{display:block;font-size:12px;font-weight:700;letter-spacing:.5px;margin-bottom:2px}
.box.example{background:var(--good-soft);border-color:var(--good)} .box.example .lbl{color:var(--good)}
.box.hook{background:var(--accent-soft);border-color:var(--accent)} .box.hook .lbl{color:var(--accent)}
.box.fun{background:var(--note-soft);border-color:var(--note)} .box.fun .lbl{color:var(--note)}
details.why{margin-top:14px;border:1px solid var(--line);border-radius:8px;padding:0 14px;font-size:16px}
details.why summary{cursor:pointer;padding:10px 0;color:var(--ink-2);font-weight:600;list-style:none}
details.why summary::before{content:"+ ";color:var(--accent)}
details.why[open] summary::before{content:"− "}
details.why p{margin:0 0 12px}

/* questions */
.q{margin-top:18px;padding:14px 16px;border:1px dashed var(--line);border-radius:8px;background:var(--surface-2)}
.q.pre{margin:0 0 18px}
.q .lbl{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.5px}
.q p.qt{margin:2px 0 10px;font-weight:600}
.opts{display:grid;gap:8px}
.opt{display:block;width:100%;text-align:right;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px;line-height:1.5;min-height:44px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good);font-weight:600}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.fb{margin-top:10px;font-size:15.5px;color:var(--ink-2)}
.fb strong.ok{color:var(--good)} .fb strong.no{color:var(--bad)}

/* flashcards */
.fc-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;color:var(--muted);font-size:14px}
.fc-bar .grp{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 16px;font-size:15px;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.sel{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.card{perspective:1400px;cursor:pointer;height:280px;margin-bottom:16px}
.card-in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.flip .card-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--line);border-radius:12px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;box-shadow:var(--shadow)}
.face.back{transform:rotateY(180deg);background:var(--accent-soft)}
.face .t{font-size:22px;font-weight:650;line-height:1.5}
.face.back .t{font-size:19px;font-weight:500}
.face small{position:absolute;bottom:12px;color:var(--muted);font-size:12.5px}
.rate{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* quiz */
.qz-head{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:10px}
.qz{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;box-shadow:var(--shadow)}
.qz .qt{font-size:19px;font-weight:600;margin:0 0 16px}
.fill{display:flex;gap:8px;flex-wrap:wrap}
.fill input{flex:1;min-width:180px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.match{display:grid;gap:10px}
.match .row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px;align-items:center}
.match .row span{font-weight:600}
.match select{padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:15px;min-height:44px;width:100%}
.match select.right{border-color:var(--good);background:var(--good-soft)} .match select.wrong{border-color:var(--bad);background:var(--bad-soft)}
.qz-nav{display:flex;justify-content:space-between;margin-top:18px;gap:10px}
.result{text-align:center;padding:30px 10px}
.result .big{font-size:44px;font-weight:700;color:var(--accent)}
.result ul{text-align:right;color:var(--ink-2);font-size:15.5px}

/* summary */
.sum{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;box-shadow:var(--shadow)}
.sum ol{padding-right:22px;margin:0}
.sum li{margin-bottom:10px}
.sum h2{font-size:20px;margin:0 0 14px}
.teach{margin-top:20px}
.teach textarea{width:100%;min-height:140px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;resize:vertical}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;cursor:zoom-out}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%;border-radius:8px;background:#fff}

/* readable sizes: body 18px, labels 14px */
body{font-size:18px}
.box,details.why,.fb,.opt,.result ul,.teach textarea{font-size:18px}
.btn,.intro{font-size:18px}
.kind,.box .lbl,.q .lbl,figcaption,.markdone,.theme-btn,.toc h4,.lesson-head span,.face small,.qz-head,.fc-bar{font-size:14px}

@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:0}
  aside.toc{display:none}
  .toc-mobile{display:block}
  html{scroll-padding-top:110px}
}
@media (max-width:640px){
  body{font-size:18px;line-height:1.8}
  html{scroll-padding-top:120px}
  /* compact top bar: title + theme */
  h1{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .title-row>div{min-width:0}
  .sub{display:none}
  .top-in{padding:8px 12px}
  .title-row{flex-wrap:nowrap;align-items:center}
  .theme-btn{flex:none;font-size:14px;padding:0 12px;min-height:44px}
  .progress{margin-top:0}
  header.top{backdrop-filter:none;background:var(--bg)}
  /* tabs become a bottom bar within thumb reach */
  nav.tabs{position:fixed;bottom:0;left:0;right:0;margin:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);gap:0;
    background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);overflow:visible}
  nav.tabs button{padding:8px 2px;font-size:14px;min-height:56px;border-bottom:0;border-top:3px solid transparent;white-space:normal;line-height:1.25}
  nav.tabs button[aria-selected="true"]{border-top-color:var(--accent);background:var(--accent-soft)}
  .wrap{padding:16px 12px calc(96px + env(safe-area-inset-bottom))}
  /* topic jump list sticks under the header */
  .toc-mobile{position:sticky;top:64px;z-index:15;margin:0 -12px 16px;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
  .toc-mobile select{min-height:46px}
  .lesson-head h2{font-size:20px}
  section.topic,.qz,.sum{padding:18px 16px;border-radius:12px}
  section.topic h3{font-size:21px}
  .kind,.box .lbl,.q .lbl,figcaption{font-size:14px}
  .markdone{font-size:14px;min-height:44px;padding:0 12px}
  .box,details.why,.fb,.opt,.result ul{font-size:17px}
  details.why summary{min-height:44px;display:flex;align-items:center}
  .opt{padding:12px 14px}
  figure{margin:14px -6px}
  figure svg{max-width:100%}
  .card{height:320px}
  .face .t{font-size:21px}
  .face.back .t{font-size:18px}
  .face small{font-size:14px}
  .rate{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .rate .btn:first-child{grid-column:1 / -1;order:3}
  .fc-bar{font-size:14px}
  .fc-bar .grp{width:100%;display:grid;grid-template-columns:1fr 1fr 1fr}
  .fc-bar .btn{font-size:14px;padding:6px 4px}
  .qz .qt{font-size:19px}
  .qz-head{font-size:14px}
  .qz-nav .btn{width:100%}
  .fill input{min-height:48px;font-size:18px}
  .match .row{grid-template-columns:minmax(0,1fr)}
  .match select{font-size:16px}
  .teach textarea{font-size:17px}
  /* enlarged table: pan around at readable size */
  .lb{display:none;align-items:flex-start;justify-content:flex-start;overflow:auto;padding:12px}
  .lb.on{display:block}
  .lb img{max-width:none;max-height:none;width:900px}
  .lb::after{content:"הקישו כדי לסגור";position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:20px;font-size:14px}
}
@media print{
  header.top,aside.toc,.toc-mobile,.markdone,.q,nav.tabs{display:none!important}
  .wrap{display:block}
  .panel[hidden]{display:none!important}
  section.topic{break-inside:avoid;box-shadow:none}
  details.why{display:block} details.why p{display:block}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="title-row">
    <div><h1 id="ttl"></h1><div class="sub" id="subt"></div></div>
    <button class="theme-btn" id="themeBtn" type="button">מצב כהה</button>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="learn" aria-selected="true">חומר הלימוד</button>
    <button role="tab" data-tab="cards" aria-selected="false">כרטיסיות</button>
    <button role="tab" data-tab="quiz" aria-selected="false">מבחן תרגול</button>
    <button role="tab" data-tab="summary" aria-selected="false">סיכום</button>
  </nav>
</div><div class="progress"><i id="prog"></i></div></header>

<div class="wrap panel" id="p-learn">
  <aside class="toc" id="toc"></aside>
  <main>
    <div class="toc-mobile"><select id="tocSel" aria-label="קפיצה לנושא"></select></div>
    <p class="intro" id="intro"></p>
    <div id="topics"></div>
  </main>
</div>
<div class="wrap single panel" id="p-cards" hidden><main id="cards" style="max-width:none"></main></div>
<div class="wrap single panel" id="p-quiz" hidden><main id="quiz" style="max-width:none"></main></div>
<div class="wrap single panel" id="p-summary" hidden><main id="summary" style="max-width:none"></main></div>
<div class="lb" id="lb"><img alt=""></div>

<script>
const L = {"title": "פיזיולוגיה של המאמץ – שיעורים 1-3", "subject": "exercise-physiology", "grade": "מבוגרים", "lang": "he", "adhd": false, "tone": "mature", "mascotName": "דופקי", "intro": "מסלולי אנרגיה, צריכת חמצן, סף לקטט ומערכת הלב – כל החומר משלושת השיעורים הראשונים, עם תרגול.", "chunks": [{"title": "שיעור 1 · אטום, יון ומולקולה", "kind": "definition", "body": "<b>פיזיולוגיה של המאמץ<\/b> = תגובת הגוף לביצוע מטלה גופנית, מדידתה והערכתה.<br><br><b>אטום<\/b> – החלקיק הקטן ביותר, מטען חשמלי 0. בגרעין: פרוטונים (+) וניוטרונים (ללא מטען). מסביב: אלקטרונים (−). מספר הפרוטונים קובע את היסוד.<br><b>יון<\/b> – אטום טעון: <b>קטיון<\/b> (+) או <b>אניון<\/b> (−). נוצר כשאלקטרון עוזב או מתווסף.<br><b>מולקולה<\/b> – כמה אטומים בקשר כימי:<br>• <b>מולקולה טהורה<\/b> – אותו יסוד (חמצן O<sub>2<\/sub>).<br>• <b>תרכובת<\/b> – 2 יסודות או יותר, תכונות חדשות (CO<sub>2<\/sub>).<br>• <b>תערובת<\/b> – יחד אבל בלי קשר כימי; כל חומר שומר על תכונותיו.", "hook": "קטיון = <b>ק<\/b>ת חיובי (+), אניון = <b>א<\/b>ני שלילי (−).", "check": {"q": "פחמן דו חמצני (CO₂) הוא:", "options": ["מולקולה טהורה", "תרכובת", "תערובת"], "answer": 1, "explain": "שני יסודות שונים (פחמן וחמצן) בקשר כימי = תרכובת."}}, {"title": "חיים ומבנה התא", "kind": "definition", "predict": {"q": "איפה בתא מופקת אנרגיה בעזרת חמצן?", "options": ["ציטופלזמה", "מיטוכונדריה", "גרעין התא"], "answer": 1}, "body": "<b>4 צורות חיים<\/b>: בעלי חיים, צמחים, פטריות, חיידקים. מאפייני חיים: גדילה והתפתחות, חילוף חומרים, תגובה לגירויים, יכולת להתרבות.<br><b>תא<\/b> – יחידת החיים הקטנה ביותר שיכולה להתקיים לבד. בשבוע 6-8 להריון כל תא מקבל תפקיד (תא עצב, תא דם אדום…).<br><br>מבנה התא:<br>• <b>ממברנה<\/b> – הקרום החיצוני.<br>• <b>ציטופלזמה<\/b> – נוזל תוך-תאי; כאן אנרגיה <b>בלי חמצן<\/b> (אנאירובי).<br>• <b>גרעין<\/b> – ה-DNA, הגנים שמקודדים לחלבונים.<br>• <b>מיטוכונדריה<\/b> – הגנרטור; אנרגיה <b>עם חמצן<\/b> (אירובי).", "hook": "מיטוכונדריה = תחנת כוח ירוקה (עם אוויר). ציטופלזמה = גנרטור חירום (בלי אוויר).", "why": "המסלולים האנאירוביים מהירים כי הם קורים מיד בנוזל התא, בלי לחכות שחמצן יגיע למיטוכונדריה."}, {"title": "מטבוליזם והומאוסטזיס", "kind": "rule", "body": "<b>מטבוליזם (חילוף חומרים)<\/b> – קליטת חומרים, עיבוד, הפקת אנרגיה ופליטת פסולת. שני סוגים:<br>• <b>קטבולי<\/b> – פירוק מולקולות גדולות לקטנות, <b>משחרר<\/b> אנרגיה.<br>• <b>אנבולי<\/b> – בניית מולקולה מקטנות, <b>דורש<\/b> אנרגיה.<br>שניהם קורים כל הזמן, גם בשינה.<br><br><b>הומאוסטזיס<\/b> – שמירה על סביבה פנימית יציבה, בטווח ערכים שמאפשר לתאים לתפקד. הגוף מזהה יציאה מהטווח ומחזיר אותו.", "example": "אכלת → הסוכר בדם עולה → חיישנים מאותתים ללבלב → הלבלב משחרר <b>אינסולין<\/b> → הסוכר חוזר לטווח התקין.", "hook": "<b>אנ<\/b>בולי = <b>אנ<\/b>בוליים = בונים שריר. <b>קט<\/b>בולי = <b>קט<\/b>ע – מפרק לחתיכות.", "check": {"q": "פירוק גליקוגן לגלוקוז הוא תהליך:", "options": ["אנבולי", "קטבולי", "הומאוסטטי"], "answer": 1, "explain": "פירוק מגדול לקטן ושחרור אנרגיה = קטבולי."}}, {"title": "אנרגטיקה ו-ATP – 3 מסלולים", "kind": "fact", "svg": "<svg viewBox='0 0 300 170' xmlns='http://www.w3.org/2000/svg' font-family='Arial' direction='rtl'><line x1='20' y1='140' x2='290' y2='140' stroke='#3a3550' stroke-width='3'/><text x='155' y='163' font-size='14' fill='#3a3550' text-anchor='middle'>זמן המאמץ ←<\/text><rect x='20' y='30' width='45' height='110' rx='8' fill='#f7bcd3' stroke='#3a3550' stroke-width='3'/><text x='42' y='22' font-size='14' fill='#3a3550' text-anchor='middle'>ATP-CP<\/text><text x='42' y='95' font-size='13' fill='#3a3550' text-anchor='middle'>10″<\/text><rect x='70' y='60' width='85' height='80' rx='8' fill='#fde4a6' stroke='#3a3550' stroke-width='3'/><text x='112' y='52' font-size='14' fill='#3a3550' text-anchor='middle'>גליקוליטי<\/text><text x='112' y='105' font-size='13' fill='#3a3550' text-anchor='middle'>עד 3 דק׳<\/text><rect x='160' y='90' width='128' height='50' rx='8' fill='#b7e4c7' stroke='#3a3550' stroke-width='3'/><text x='224' y='82' font-size='14' fill='#3a3550' text-anchor='middle'>אירובי<\/text><text x='224' y='121' font-size='13' fill='#3a3550' text-anchor='middle'>שעות<\/text><\/svg>", "body": "<b>אנרגטיקה<\/b> – היכולת לבצע עבודה; שימוש באבות המזון להפקת אנרגיה. אנרגיה לא נעלמת – היא מתגלגלת. בפעילות רק <b>כ-25%<\/b> מהאנרגיה הופכת לעבודה; השאר הופך לחום.<br><br>הגוף לא משתמש ישירות באנרגיה של המזון – הוא ממיר אותה ל-<b>ATP<\/b> (Adenosine Tri Phosphate, 3 קבוצות זרחן).<br><br>שלושה מסלולים, <b>כולם פעילים יחד<\/b>, ותמיד אחד דומיננטי לפי הדרישה:<br>• <b>אירובי<\/b> – הכי הרבה ATP, משתמש בחמצן, הכי איטי.<br>• <b>2 אנאירוביים<\/b> – ATP-CP וגליקוליטי: מהירים, בלי חמצן, לזמן קצר.", "hook": "מהיר ↔ קצר. איטי ↔ ארוך. ככל שהמסלול מהיר יותר – הוא נגמר מהר יותר.", "fun": "75% מהאנרגיה הולכת לחום – בגלל זה מזיעים גם ביום קר."}, {"title": "מסלול ATP-CP (פוספוגני)", "kind": "rule", "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAKNBGcDASIAAhEBAxEB/8QAHQABAAEFAQEBAAAAAAAAAAAAAAYBBAUHCAMCCf/EAFYQAAAFAwADCwUNBQcDAwQCAwABAgMEBQYRBxIhExQWMUFRU1RVkpMVImGR0ggXMjU2VnFyc4GUobEmNFKzwiMzQnSCweEkYqIlQ9EYREVjN0Zk8PH/xAAaAQEBAQEBAQEAAAAAAAAAAAAAAQIDBAUG/8QAMxEBAAIBAgUDAwQBAwUBAQAAAAECEQMSBBQxUbEFIUET0fAiMoGRYQYVcRYjQqHBUvH/2gAMAwEAAhEDEQA/AOqQAWc+a9HfjMMNNuOSFKSWus0kWE55CPmFiJmcQkziMyvAFlulV6tB8dXsBulV6tB8dXsC7JTdC9AWW6VXq0Hx1ewG6VXq0Hx1ewGyTdC9AWW6VXq0Hx1ewG6VXq0Hx1ewGyTdC9AWW6VXq0Hx1ewG6VXq0Hx1ewGyTdC9AWW6VXq0Hx1ewG6VXq0Hx1ewGyTdC9AWW6VXq0Hx1ewG6VXq0Hx1ewGyTdC9AWW6VXq0Hx1ewG6VXq0Hx1ewGyTdC9AWW6VXq0Hx1ewG6VXq0Hx1ewGyTdC9AWW6VXq0Hx1ewG6VXq0Hx1ewGyTdC9AWW6VXq0Hx1ewG6VXq0Hx1ewGyTdC9AWW6VXq0Hx1ewG6VXq0Hx1ewGyTdC9AWW6VXq0Hx1ewG6VXq0Hx1ewGyTdC9AWW6VXq0Hx1ewG6VXq0Hx1ewGyTdC9AWW6VXq0Hx1ewG6VXq0Hx1ewGyTdC9AWW6VXq0Hx1ewG6VXq0Hx1ewGyTdC9AWW6VXq0Hx1ewG6VXq0Hx1ewGyTdC9AWW6VXq0Hx1ewG6VXq0Hx1ewGyTdC9AWW6VXq0Hx1ewG6VXq0Hx1ewGyTdC9AWW6VXq0Hx1ewG6VXq0Hx1ewGyTdC9AWW6VXq0Hx1ewG6VXq0Hx1ewGyTdC9AWW6VXq0Hx1ewG6VXq0Hx1ewGyTdC9AW  מעדיף פחמימות על חלבון? חלבון איטי לשימוש, יעילות החמצון שלו נמוכה, ויש עלות אנרגטית לסילוק אמוניה."}, {"title": "ערך קלורי לגרם", "kind": "fact", "body": "• <b>שומן – 9<\/b> קלוריות לגרם<br>• <b>אלכוהול – 7<\/b><br>• <b>פחמימות וחלבונים – 4<\/b><br>• <b>סיבים – 2<\/b><br>• <b>מים – 0<\/b><br><br>ברקמת השומן יש אנרגיה ליותר מ-<b>400 מייל ריצה<\/b> – גם אצל אנשים רזים. מאגר הגליקוגן מוגבל הרבה יותר, ולכן במאמץ ממושך (מרתון, איש ברזל) חשוב לאכול תוך כדי.", "hook": "9-7-4-2-0: שומן, אלכוהול, פחמימה/חלבון, סיבים, מים.", "fun": "האנרגיה האמיתית במרתון היא לא כמה שומן יש לך – אלא כמה גליקוגן נשאר."}, {"title": "שיעור 2 · קלוריות, BMR ו-RMR", "kind": "definition", "body": "<b>קלוריה<\/b> – יחידת אנרגיה שנמדדת לפי פליטת חום. כשאומרים ״קלוריות״ מתכוונים ל<b>קילו-קלוריות<\/b>.<br><b>1 ליטר חמצן ≈ 5 קק״ל<\/b> במסלול האירובי.<br><br><b>BMR<\/b> – חילוף חומרים בסיסי במנוחה. אי אפשר למדוד אותו.<br><b>RMR<\/b> – ההוצאה האנרגטית במנוחה; אפשר למדוד, קירוב ל-BMR. משתנה עם הגיל.<br>איברים ״שורפים״ הרבה לק״ג: <b>מוח, לב, כליות, כבד<\/b>. שריר ושומן – פחות.<br><br>פירוק ההוצאה היומית:<br>• <b>RMR – 60-70%<\/b> (תלוי בגיל, מין, מסת שריר)<br>• <b>עיכול מזון – כ-10%<\/b><br>• <b>AEE<\/b> – פעילות מתוכננת ולא מתוכננת – <b>10-30%<\/b>", "hook": "‏BMR = <b>B<\/b>asic, תיאורטי. RMR = <b>R<\/b>eal – מה שמודדים.", "check": {"q": "רץ צרך 30 ליטר חמצן באימון. בערך כמה קק״ל שרף?", "options": ["30", "150", "300"], "answer": 1, "explain": "1 ליטר חמצן ≈ 5 קק״ל → 30 × 5 = 150."}}, {"title": "יעילות מטבולית ומקורות אנרגיה", "kind": "rule", "svg": "<svg viewBox='0 0 300 180' xmlns='http://www.w3.org/2000/svg' font-family='Arial'><line x1='30' y1='150' x2='290' y2='150' stroke='#3a3550' stroke-width='3'/><line x1='30' y1='150' x2='30' y2='15' stroke='#3a3550' stroke-width='3'/><text x='160' y='172' font-size='14' fill='#3a3550' text-anchor='middle'>עצימות ←<\/text><path d='M30 40 C120 50 170 120 285 140' fill='none' stroke='#e8a06b' stroke-width='5'/><path d='M30 140 C120 130 170 60 285 35' fill='none' stroke='#6f9be0' stroke-width='5'/><circle cx='158' cy='92' r='8' fill='#d6c2f6' stroke='#3a3550' stroke-width='3'/><text x='60' y='32' font-size='14' fill='#c47c45'>שומן<\/text><text x='235' y='28' font-size='14' fill='#4a76bd'>פחמימה<\/text><text x='170' y='112' font-size='13' fill='#3a3550'>נקודת המפגש<\/text><\/svg>", "body": "יש בגוף הרבה יותר שומן מפחמימה. ככל שמסתמכים <b>יותר על שומן<\/b> – היעילות המטבולית גבוהה יותר: שומרים פחמימות לרגעים החשובים.<br>• במנוחה – יותר אנרגיה משומן.<br>• ככל שהעצימות עולה – יותר פחמימות (זמינות מהר).<br>• בעצימות נמוכה – אין שימוש בגליקוגן בכלל.<br><br>יש <b>נקודה<\/b> שבה השימוש בשומן ובפחמימה שווה. המטרה: לדחות אותה כמה שיותר (לעצימות גבוהה יותר) בעזרת <b>שיפור הכושר האירובי<\/b>. חשוב במיוחד לספורטאי סיבולת.", "hook": "מאומן = ״מכונה היברידית״ שנוסעת על שומן גם במהירות גבוהה."}, {"title": "מיתוסים – כולם לא נכונים", "kind": "fact", "body": "• שומן נשרף רק אחרי 20 דקות.<br>• כשנגמר השומן מתחילים לשרוף שריר.<br>• כדי לשרוף שומן צריך לעבוד בעצימות נמוכה.<br>• אימון בצום שורף יותר שומן ועדיף לירידה במשקל.<br>• כדי לרדת במשקל צריך אימונים עצימים כי בסוף שורפים המון קלוריות.<br>• אימון אירובי שורף שריר.", "hook": "במבחן: כל משפט מהרשימה הזו = <b>לא נכון<\/b>.", "check": {"q": "״שומן מתחיל להישרף רק אחרי 20 דקות אימון״", "options": ["נכון", "לא נכון – מיתוס"], "answer": 1, "explain": "כל המסלולים פעילים כל הזמן. שומן משמש מקור אנרגיה גם במנוחה."}}, {"title": "גרעון חמצן, מצב יציב ו-EPOC", "kind": "rule", "svg": "<svg viewBox='0 0 300 180' xmlns='http://www.w3.org/2000/svg' font-family='Arial'><line x1='20' y1='150' x2='290' y2='150' stroke='#3a3550' stroke-width='3'/><line x1='20' y1='150' x2='20' y2='15' stroke='#3a3550' stroke-width='3'/><path d='M60 60 L110 60 C85 62 70 80 60 150 Z' fill='#aecbf5'/><path d='M190 60 C200 120 230 145 285 148 L285 150 L190 150 Z' fill='#fde4a6'/><path d='M60 150 C70 80 85 62 110 60 L190 60 C200 120 230 145 285 148' fill='none' stroke='#3a3550' stroke-width='4'/><line x1='60' y1='60' x2='60' y2='150' stroke='#3a3550' stroke-width='2' stroke-dasharray='5 4'/><text x='64' y='45' font-size='13' fill='#3a3550'>גרעון<\/text><text x='125' y='45' font-size='13' fill='#3a3550'>מצב יציב<\/text><text x='215' y='120' font-size='13' fill='#3a3550'>EPOC<\/text><text x='155' y='172' font-size='13' fill='#3a3550' text-anchor='middle'>זמן ← צריכת O₂<\/text><\/svg>", "body": "‏<b>EPOC<\/b> – Excess Post-exercise Oxygen Consumption = צריכת חמצן עודפת בהתאוששות.<br><br><b>1. תחילת המאמץ – גרעון חמצן<\/b>: צריכת החמצן עולה אקספוננציאלית; המערכת האירובית לוקחת זמן להתייצב, ועד אז המסלולים <b>האנאירוביים<\/b> משלימים (בעיקר מפחמימות). עצימות גבוהה = גרעון גדול. מאומן = גרעון קטן.<br><b>2. מצב יציב<\/b>: המערכת האירובית נותנת כמעט הכל. צריכת חמצן, דופק, אוורור ולקטט – יציבים.<br><b>3. התאוששות – EPOC<\/b>: דקות עד <b>24-48 שעות<\/b>.<br>• מאמץ ארוך יותר → EPOC גדל <b>ביחס ישר<\/b>.<br>• מאמץ עצים יותר → EPOC גדל <b>אקספוננציאלית<\/b>.<br>• מאומן → EPOC קטן יותר (כי גרעון החמצן שלו קטן).", "hook": "״החוב״ שלקחת בהתחלה (גרעון) – מחזירים בסוף (EPOC).", "check": {"q": "מכפילים את עצימות המאמץ. מה קורה ל-EPOC?", "options": ["גדל ביחס ישר", "גדל אקספוננציאלית", "לא משתנה"], "answer": 1, "explain": "עצימות → אקספוננציאלי. משך → ביחס ישר."}}, {"title": "התאוששות לפי מסלול ותשישות", "kind": "rule", "body": "זמני התאוששות:<br>• <b>פוספוגני<\/b> (עד 10 שנ׳ מרבי) – <b>2-5 דק׳ מנוחה ללא תנועה<\/b>.<br>• <b>גליקוליטי<\/b> – התאוששות <b>אקטיבית<\/b> לפינוי לקטט: ניעור ידיים ורגליים, הליכה קלה – <b>עד 20 דק׳<\/b>.<br>• <b>אירובי<\/b> – חידוש נוזלים ופחמימות; עד <b>24-48 שעות<\/b>.<br><br><b>תשישות<\/b> – ירידה בהפקת הכוח או ההספק כתוצאה מהמאמץ. גורמת להוריד עצימות (להוריד משקל) או ל<b>כשל<\/b> (לא מצליחים להרים בכלל).<br>קשה לחקור אותה כי יש לה כמה מקורות: <b>עצביים, תרבותיים, מטבוליים ופסיכולוגיים<\/b>.", "hook": "ספרינט – לשבת. 400 מ׳ – ללכת. מרתון – לאכול ולשתות."}, {"title": "צריכת חמצן מרבית – VO₂max", "kind": "definition", "body": "<b>צריכת חמצן<\/b> – כמות החמצן להפקת אנרגיה בדקה.<br><b>VO<sub>2<\/sub>max (צח״מ)<\/b> – כמות החמצן <b>המרבית<\/b> שהגוף יכול לקלוט בשרירים בדקה. נמדד ב<b>ליטר/דקה<\/b>, או יחסית למשקל ב<b>מ״ל/ק״ג/דקה<\/b>.<br>• עצימות עולה → צריכת חמצן עולה ביחס ישר.<br>• במנוחה – כמעט זהה בין מאומן ללא מאומן (באותו משקל).<br><br><b>מנוחה = 3.5 מ״ל/ק״ג/דק׳<\/b> (0.25 ליטר) = <b>1 MET<\/b> (אדם 170 ס״מ, 70 ק״ג).<br>טווח: 20 (מבוגרים לא בכושר/חולים) עד 90 (ספורטאי עילית). <b>20 נמוך · 40 בינוני · 60 גבוה<\/b>.<br><br><b>3 מערכות<\/b> קובעות: <b>נשימה<\/b> (מכניסה חמצן) · <b>לב<\/b> (מזרים דם) · <b>שרירים<\/b> (מנצלים).<br>גורמים: <b>גנטיקה – 60%<\/b> מהפוטנציאל · <b>מין<\/b> – גברים גבוה בכ-20% (מסת שריר, אחוז שומן, המוגלובין) · <b>גיל<\/b> · <b>הרכב גוף<\/b> · <b>רמת אימון<\/b> (אירוביים > אנאירוביים).", "hook": "נשימה מכניסה → לב מוביל → שריר משתמש. שרשרת – החוליה החלשה קובעת.", "fun": "20 → 40 → 60: כל קפיצה של 20 = דרגה אחת למעלה."}, {"title": "מדידת VO₂max ומבחן קופר", "kind": "formula", "body": "<b>מבחן מעבדה<\/b>: מסכה מודדת כמה חמצן נכנס ויוצא, במאמץ שעולה בהדרגה. כשצריכת החמצן <b>מפסיקה לעלות<\/b> – הגענו למקסימום. המתאמן עדיין יכול להגביר קצב בעזרת המערכות האנאירוביות.<br>עדיף לבדוק <b>בענף הספציפי<\/b>: רוכב אופניים שנבדק בריצה – התוצאה לא תשקף את יכולתו.<br><br><b>מבחן קופר<\/b> – המרחק הגדול ביותר ב-<b>12 דקות<\/b>:<br><b>VO<sub>2<\/sub>max = (D<sub>12<\/sub>(m) − 504.9) / 44.73<\/b><br>התוצאה במ״ל/ק״ג/דקה.", "example": "רצת 3,000 מ׳ ב-12 דק׳: (3000 − 504.9) / 44.73 = 2495.1 / 44.73 ≈ <b>55.8<\/b> מ״ל/ק״ג/דק׳ – בין בינוני לגבוה.", "hook": "קופר = <b>12<\/b> דקות. מחסירים <b>505<\/b>, מחלקים ב-<b>45<\/b> (בערך).", "check": {"q": "מתאמן רץ 2,300 מ׳ במבחן קופר. מה ה-VO₂max שלו בערך?", "options": ["≈ 30", "≈ 40", "≈ 51"], "answer": 1, "explain": "(2300 − 504.9) / 44.73 = 1795.1 / 44.73 ≈ 40.1 → בינוני."}}, {"title": "סף הלקטט", "kind": "definition", "svg": "<svg viewBox='0 0 300 180' xmlns='http://www.w3.org/2000/svg' font-family='Arial'><line x1='30' y1='150' x2='290' y2='150' stroke='#3a3550' stroke-width='3'/><line x1='30' y1='150' x2='30' y2='10' stroke='#3a3550' stroke-width='3'/><rect x='30' y='15' width='100' height='135' fill='#b7e4c7' opacity='0.45'/><rect x='130' y='15' width='75' height='135' fill='#fde4a6' opacity='0.55'/><rect x='205' y='15' width='85' height='135' fill='#f7bcd3' opacity='0.55'/><path d='M30 135 C90 133 120 128 130 122 C170 108 195 98 205 90 C240 60 265 35 285 15' fill='none' stroke='#3a3550' stroke-width='4'/><line x1='130' y1='150' x2='130' y2='15' stroke='#3a3550' stroke-width='2' stroke-dasharray='5 4'/><line x1='205' y1='150' x2='205' y2='15' stroke='#3a3550' stroke-width='2' stroke-dasharray='5 4'/><text x='134' y='32' font-size='13' fill='#3a3550'>סף 1<\/text><text x='209' y='32' font-size='13' fill='#3a3550'>סף 2<\/text><text x='138' y='140' font-size='12' fill='#3a3550'>≈2 mmol<\/text><text x='212' y='140' font-size='12' fill='#3a3550'>≈4 mmol<\/text><text x='160' y='172' font-size='13' fill='#3a3550' text-anchor='middle'>עצימות ← לקטט בדם<\/text><\/svg>", "body": "<b>לקטט<\/b> – מולקולה שנוצרת בשריר בגליקוליזה, <b>כל הזמן<\/b> – גם במנוחה.<br>• מאמץ מתון – ייצור = פינוי → ריכוז קבוע.<br>• מעל עצימות מסוימת – ייצור > פינוי → הריכוז עולה ומתייצב ברמה חדשה.<br>• עצימות גבוהה מאוד – הריכוז עולה בלי להתייצב.<br><br><b>סף ראשון (סף לקטט)<\/b> – תחילת העלייה (והתייצבות), <b>≈2 מילימול/ליטר<\/b> – מאמץ מתון.<br><b>סף שני (OBLA / MMAS / MLSS)<\/b> – הצטברות משמעותית <b>ללא התייצבות<\/b>, <b>≈4 מילימול/ליטר<\/b> – מאמץ עצים.", "hook": "סף <b>1<\/b> ≈ <b>2<\/b> ממול. סף <b>2<\/b> ≈ <b>4<\/b> ממול. (כפול 2)", "why": "למה הלקטט לא עולה במאמץ מתון אם הוא נוצר כל הזמן? כי קצב הפינוי שווה לקצב הייצור – אין הצטברות."}, {"title": "מדידת הספים ותחומי עצימות", "kind": "rule", "body": "שיטות מדידה:<br>• <b>מבחן סף לקטט<\/b> – מעלים עצימות כל <b>3-4 דקות<\/b>, ובסוף כל שלב דגימת דם מהאצבע/אוזן.<br>• <b>מבחן חמישה מפגשים<\/b> – כל מפגש עד 30 דק׳, בכל מפגש רצים מהר יותר, בדיקת לקטט כל 5 דק׳. כשמגיעים לכשל – עברו את הסף השני; המהירות של השלב הקודם = המהירות המרבית במצב יציב. <b>מדויק יותר<\/b>.<br>• <b>מבחן הדיבור<\/b> – מדברים כמה משפטים ברצף בחופשיות = מאמץ מתון. מתחילים להתקשות = עברו את הסף הראשון.<br><br>תחומי עצימות:<br>• <b>מתחת לסף 1<\/b> – מתון, מתמידים הרבה זמן.<br>• <b>בין סף 1 לסף 2<\/b> – גבוה יותר, עדיין מצב יציב; זמן קצר יותר.<br>• <b>מעל סף 2<\/b> – אין מצב יציב, אי אפשר להתמיד לאורך זמן.<br><br><b>למה למדוד?<\/b> לבנות תוכנית אישית, ולראות שיפור לאורך העונה – בצח״מ ובספים.", "hook": "רמזור: <b>ירוק<\/b> – מתחת לסף 1 · <b>צהוב<\/b> – בין הספים · <b>אדום<\/b> – מעל סף 2.", "check": {"q": "באמצע ריצה כבר קשה לך להגיד משפט שלם. מה זה אומר?", "options": ["אתה מתחת לסף הראשון", "עברת את הסף הראשון", "הגעת ל-VO₂max"], "answer": 1, "explain": "מבחן הדיבור: קושי לדבר = מעבר לסף הראשון."}}, {"title": "שיעור 3 · מערכת הלב וכלי הדם · הדם", "kind": "definition", "body": "• <b>לב<\/b> – משאבה. • <b>עורקים<\/b> – לחץ גבוה, דם <b>יוצא<\/b> מהלב. • <b>ורידים<\/b> – לחץ נמוך, דם <b>חוזר<\/b> ללב. • <b>נימים<\/b> – מקשרים בין עורק לווריד.<br>המערכת מובילה: חמצן, דלק (מזון), חומרי בניין (חומצות אמינו), פסולת (CO<sub>2<\/sub>, לקטט, אוראה), תאי דם לבנים, הורמונים. וגם <b>ויסות חום<\/b>.<br><br><b>הדם<\/b> – רקמת חיבור: תאים אדומים (O<sub>2<\/sub> לתאים, CO<sub>2<\/sub> לריאות), לבנים (חיסון), טסיות (קרישה). כ-<b>55% פלזמה, 45% אדומים, 1% לבנים<\/b>. הפלזמה כ-90% מים.<br><br><b>המוגלובין<\/b> – חלבון בתא האדום, נושא <b>4 מולקולות חמצן<\/b>; כ-<b>280 מיליון<\/b> בכל תא. בריאות (לחץ חמצן גבוה) קושר; בתאים משחרר.<br>גברים <b>14-18 גרם<\/b>, נשים <b>12-16 גרם<\/b> – עוד סיבה לצח״מ גבוה יותר אצל גברים.", "hook": "<b>ע<\/b>ורק = <b>ע<\/b>וזב את הלב. <b>ו<\/b>ריד = <b>ו<\/b>חוזר.", "check": {"q": "מה האחוז הגדול ביותר בנפח הדם?", "options": ["תאי דם אדומים", "פלזמה", "תאי דם לבנים"], "answer": 1, "explain": "פלזמה כ-55%, אדומים 45%, לבנים 1%."}}, {"title": "מבנה הלב ומחזור הדם", "kind": "rule", "svg": "<svg viewBox='0 0 300 190' xmlns='http://www.w3.org/2000/svg' font-family='Arial'><rect x='105' y='10' width='90' height='40' rx='12' fill='#aecbf5' stroke='#3a3550' stroke-width='3'/><text x='150' y='36' font-size='15' fill='#3a3550' text-anchor='middle'>ריאות<\/text><rect x='105' y='145' width='90' height='40' rx='12' fill='#fde4a6' stroke='#3a3550' stroke-width='3'/><text x='150' y='171' font-size='15' fill='#3a3550' text-anchor='middle'>הגוף<\/text><rect x='160' y='68' width='70' height='60' rx='10' fill='#f7bcd3' stroke='#3a3550' stroke-width='3'/><text x='195' y='94' font-size='13' fill='#3a3550' text-anchor='middle'>צד שמאל<\/text><text x='195' y='112' font-size='12' fill='#3a3550' text-anchor='middle'>עשיר O₂<\/text><rect x='70' y='68' width='70' height='60' rx='10' fill='#d6c2f6' stroke='#3a3550' stroke-width='3'/><text x='105' y='94' font-size='13' fill='#3a3550' text-anchor='middle'>צד ימין<\/text><text x='105' y='112' font-size='12' fill='#3a3550' text-anchor='middle'>עשיר CO₂<\/text><path d='M195 50 L195 66' stroke='#c0457a' stroke-width='4' marker-end='url(#a)'/><path d='M230 100 C285 100 285 165 197 165' fill='none' stroke='#c0457a' stroke-width='4' marker-end='url(#a)'/><path d='M103 165 C15 165 15 100 68 100' fill='none' stroke='#6a5acd' stroke-width='4' marker-end='url(#a)'/><path d='M105 66 L105 52' stroke='#6a5acd' stroke-width='4' marker-end='url(#a)'/><defs><marker id='a' markerWidth='8' markerHeight='8' refX='4' refY='4' orient='auto'><path d='M0 0 L8 4 L0 8 Z' fill='#3a3550'/><\/marker><\/defs><\/svg>", "body": "שריר הלב = <b>מיוקארד<\/b>. מצופה מבפנים ב<b>אנדוקארד<\/b> ומבחוץ ב<b>אפיקארד<\/b> (חלקות, מונעות חיכוך).<br><b>4 מדורים<\/b>: 2 עליות + 2 חדרים. שמאל וימין מופרדים; בין עלייה לחדר יש <b>מסתם<\/b>.<br><br>המסלול:<br>ריאות → <b>4 ורידי הריאה<\/b> → עלייה שמאל → מסתם → חדר שמאל → <b>אבי העורקים<\/b> → עורקים → עורקיקים → נימים → ורידונים → ורידים → <b>2 הורידים הנבובים<\/b> → עלייה ימין → חדר ימין → <b>עורק הריאה<\/b> → ריאות.<br><br>• <b>מחזור גדול (סיסטמי)<\/b> – לב ↔ כל הגוף.<br>• <b>מחזור קטן (פולמונרי)<\/b> – לב ↔ ריאות.", "hook": "״שמאל = שולח לגוף״. עורק הריאה הוא העורק היחיד עם דם דל בחמצן – כי ״עורק״ = יוצא מהלב, לא ״עשיר בחמצן״.", "why": "למה דופן חדר שמאל עבה יותר? הוא דוחף דם לכל הגוף (מחזור גדול, לחץ גבוה), וחדר ימין רק לריאות הקרובות."}, {"title": "כלי הדם והפעילות המכנית", "kind": "definition", "body": "• <b>עורק<\/b> – קוטר קטן יחסית, לחץ גבוה, שכבת <b>שריר חלק רחבה<\/b> שעוזרת לדחוף את הדם.<br>• <b>וריד<\/b> – שריר חלק דק יותר, לחץ נמוך, קוטר <b>גדול<\/b> יותר, ויש <b>שסתומים<\/b> שמונעים חזרה אחורה עם כוח הכובד.<br>• <b>נימים<\/b> – מקשרים עורק לווריד; כאן <b>חילוף החומרים<\/b>.<br><br><b>סיסטולה<\/b> – כיווץ החדרים; דם יוצא לעורקים.<br><b>דיאסטולה<\/b> – הרפיית החדרים; דם נכנס מהעליות לחדרים.<br>פעימה אחת = <b>⅓ סיסטולה + ⅔ דיאסטולה<\/b>.", "hook": "<b>ס<\/b>יסטולה = <b>ס<\/b>וחט. <b>ד<\/b>יאסטולה = <b>ד<\/b>לת פתוחה, ממלאים.", "check": {"q": "למה יש שסתומים דווקא בוורידים?", "options": ["כי הלחץ בהם גבוה", "כדי שהדם לא יחזור אחורה בגלל כוח הכובד", "כדי לסנן פסולת"], "answer": 1, "explain": "בוורידים הלחץ נמוך, והשסתומים מונעים זרימה לאחור."}}, {"title": "הפעילות החשמלית ואספקת הדם ללב", "kind": "fact", "body": "<b>תאי קוצב<\/b> מייצרים דחף חשמלי בעצמם. <b>הקוצב הראשי<\/b> (60-100 בדקה) → הדחף עובר בעליות → הן מתכווצות → <b>הקוצב המשני<\/b> מעכב לרגע כדי שהעליות יסיימו → הדחף עובר במחיצה בין החדרים → החדרים מתכווצים יחד (סיסטולה).<br><br><b>א.ק.ג<\/b> מודד את הפעילות החשמלית:<br>• <b>גל P<\/b> – הראשון והקטן: כיווץ העליות. אחריו הפסקה קצרה (ההשהיה בין הקוצבים).<br>• <b>QRS<\/b> – כיווץ החדרים.<br>• <b>גל T<\/b> – הרפיית החדרים, טעינה לפעימה הבאה.<br><br><b>אספקת דם ללב<\/b>: מעורקים שיוצאים מאבי העורקים, <b>בזמן הדיאסטולה<\/b> (בכיווץ השריר לוחץ על העורקים). הלב כמעט <b>רק אירובי<\/b> – פגיעה באספקת החמצן יכולה להיות קטלנית.", "hook": "‏P-QRS-T = עליות מתכווצות → חדרים מתכווצים → חדרים נחים."}, {"title": "תפוקת לב ודופק", "kind": "formula", "body": "<b>תפוקת לב (Q)<\/b> – כמה דם הלב מוציא בדקה (ליטר/דקה):<br><b>Q = SV × HR<\/b><br>SV = נפח פעימה (מ״ל, מחדר שמאל) · HR = דופק (פעימות לדקה).<br>במנוחה כ-<b>5 ליטר/דקה<\/b>; במאמץ עד <b>פי 4-5<\/b>.<br><br>הדופק נקבע לפי הדרישה לחמצן, ומושפע ממערכת העצבים <b>האוטונומית<\/b> (אין שליטה):<br>• <b>סימפתטית<\/b> – לחץ, חרדה, מאמץ: <b>מעלה<\/b> דופק, מגביר כיווץ, מרחיבה עורקים כליליים.<br>• <b>פראסימפתטית<\/b> – רגיעה ועיכול: <b>מורידה<\/b> דופק, מפחיתה כיווץ, מצרה עורקים כליליים.<br><br><b>דופק מנוחה<\/b> – בבוקר ביקיצה טבעית; ירידה = שיפור כושר.<br><b>דופק מרבי<\/b> ≈ <b>220 − גיל<\/b> (226 − גיל לנשים) – אבל עדיף בבדיקה.<br>משפיעים: <b>גנטיקה וגיל<\/b> (רק הם קובעים דופק מרבי), סוג פעילות, מסת שריר מעורבת, סביבה, מצב נפשי, תרופות, סטטוס אימוני.<br><b>שונות הדופק (HRV)<\/b> – המרווח בין פעימות לא קבוע. מאומן → פראסימפתטית דומיננטית.", "example": "בת 30: דופק מרבי משוער = 226 − 30 = <b>196<\/b>. בן 30: 220 − 30 = <b>190<\/b>.", "hook": "<b>ס<\/b>ימפתטית = <b>ס<\/b>כנה (ברח/הילחם). <b>פ<\/b>ראסימפתטית = <b>פ<\/b>יקניק (נח ומעכל).", "check": {"q": "נפח פעימה 100 מ״ל, דופק 150. מה תפוקת הלב?", "options": ["1.5 ליטר/דקה", "15 ליטר/דקה", "150 ליטר/דקה"], "answer": 1, "explain": "100 × 150 = 15,000 מ״ל = 15 ליטר/דקה."}}, {"title": "נפח פעימה – 3 גורמים", "kind": "rule", "predict": {"q": "עד איזו עצימות נפח הפעימה ממשיך לעלות?", "options": ["עד 40% מהמרבי", "עד 80% מהמרבי", "עד המקסימום"], "answer": 0}, "body": "<b>נפח פעימה (SV)<\/b> – כמות הדם מחדר שמאל לאבי העורקים בכל פעימה. מושפע מ:<br><b>1. נפח מילוי (Preload)<\/b> – כמה החדר התמלא. תלוי ב<b>החזר ורידי<\/b>. במנוחה רוב הדם בוורידים (לחץ נמוך, שסתומים). ההחזר מתאפשר בזכות שסתומים, לחץ השרירים על הוורידים ונשימה. במאמץ ההחזר עולה.<br><b>חוק פראנק-סטרלינג<\/b>: בדיאסטולה שריר הלב נמתח → נאגר כוח → כיווץ חזק יותר → נפח פעימה גדל.<br><b>2. כוח הכיווץ<\/b> – המערכת הסימפתטית משחררת יוני <b>סידן<\/b> → כיווץ חזק → נפח גדול.<br><b>3. תנגודת היקפית (Afterload)<\/b> – כמה העורקים מתנגדים. תנגודת גדולה → נפח <b>קטן<\/b>.<br><br>נפח הפעימה עולה עד <b>40%<\/b> מהמאמץ המרבי; אחר כך העלייה בתפוקה באה <b>רק מהדופק<\/b>.", "hook": "‏Preload = כמה <b>נכנס<\/b> · כיווץ = כמה <b>חזק<\/b> · Afterload = כמה <b>מפריעים<\/b>.", "fun": "פראנק-סטרלינג כמו גומייה: מותחים יותר → יורה רחוק יותר."}, {"title": "הסתגלות לאימון אירובי", "kind": "fact", "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAJeBGgDASIAAhEBAxEB/8QAHQABAAIDAQEBAQAAAAAAAAAAAAYHBAUIAwIBCf/EAFkQAAAFAgIEBQ4NAgUBBgUFAQABAgMEBQYHERITIZIIFzFUVhQVFjdBUVNxc3SRsbLRIjIzNDU2UlVhgZTB0jhyI0JXdaGTJCYnKENGGCVEYmRFY4KD4fH/xAAaAQEBAAMBAQAAAAAAAAAAAAAAAgEDBAUG/8QALhEBAAEDAgMIAwADAQEBAAAAAAECEVEDEgQyQiExgZGhseHwBRNBFCJhcRUz/9oADAMBAAIRAxEAPwDqkB5yXDZjOuJy0kIUos++RDAh9c5cRiR1ZGRrW0r0epzPLMs8vjiopvF7pmq02bMBhaip8+jfpj/mGoqfPo36Y/5htjPubpwzQGFqKnz6N+mP+Yaip8+jfpj/AJhtjPubpwzQGFqKnz6N+mP+Yaip8+jfpj/mG2M+5unDNAYWoqfPo36Y/wCYaip8+jfpj/mG2M+5unDNAYWoqfPo36Y/5hqKnz6N+mP+YbYz7m6cM0Bhaip8+jfpj/mGoqfPo36Y/wCYbYz7m6cM0Bhaip8+jfpj/mGoqfPo36Y/5htjPubpwzQGFqKnz6N+mP8AmGoqfPo36Y/5htjPubpwzQGFqKnz6N+mP+Yaip8+jfpj/mG2M+5unDNAYWoqfPo36Y/5hqKnz6N+mP8AmG2M+5unDNAYWoqfPo36Y/5hqKnz6N+mP+YbYz7m6cM0Bhaip8+jfpj/AJhqKnz6N+mP+YbYz7m6cM0Bhaip8+jfpj/mGoqfPo36Y/5htjPubpwzQGFqKnz6N+mP+Yaip8+jfpj/AJhtjPubpwzQGFqKnz6N+mP+Yaip8+jfpj/mG2M+5unDNAYWoqfPo36Y/wCYaip8+jfpj/mG2M+5unDNAYWoqfPo36Y/5hqKnz6N+mP+YbYz7m6cM0Bhaip8+jfpj/mGoqfPo36Y/wCYbYz7m6cM0Bhaip8+jfpj/mGoqfPo36Y/5htjPubpwzQGFqKnz6N+mP8AmGoqfPo36Y/5htjPubpwzQGFqKnz6N+mP+Yaip8+jfpj/mG2M+5unDNAYWoqfPo36Y/5hqKnz6N+mP8AmG2M+5unDNAYWoqfPo36Y/5hqKnz6N+mP+YbYz7m6cM0Bhaip8+jfpj/AJhqKnz6N+mP+YbYz7m6cM0Bhaip8+jfpj/mGoqfPo36Y/5htjPubpwzQGFqKnz6N+mP+Yaip8+jfpj/AJhtjPubpwzQGFqKnz6N+mP+Yaip8+jfpj/mG2M+5unDNAYWoqfPo36Y/wCYaip8+jfpj/mG2M+5unDNAYWoqfPo36Y/5hqKnz6N+mP+YbYz7m6cM0Bhaip8+jfpj/mGoqfPo36Y/wCYbYz7m6cM0Bhaip8+jfpj/mGoqfPo36Y/5htjPubpwzQGFqKnz6N+mP8AmGoqfPo36Y/5htjPubpwzQGFqKnz6N+mP+Yaip8+jfpj/mG2M+5unDNAYWoqfPo36Y/5hqKnz6N+mP8AmG2M+5unDNAYWoqfPo36Y/5hqKnz6N+mP+YbYz7m6cM0Bhaip8+jfpj/AJhqKnz6N+mP+YbYz7m6cM0Bhaip8+jfpj/mGoqfPo36Y const LESSONS = [{"name": "שיעור ראשון", "title": "מבוא ומסלולי האנרגיה", "from": 0, "to": 7}, {"name": "שיעור שני", "title": "אנרגיה, צריכת חמצן וסף הלקטט", "from": 8, "to": 16}, {"name": "שיעור שלישי", "title": "מערכת הלב וכלי הדם", "from": 17, "to": 24}];
const KIND = {definition:"הגדרה",rule:"עיקרון",formula:"נוסחה",example:"דוגמה",fact:"עובדות",text:"טקסט"};
const $ = s => document.querySelector(s);
const el = (t, a={}, h="") => { const e=document.createElement(t); for(const k in a) e.setAttribute(k,a[k]); if(h) e.innerHTML=h; return e; };
const store = {
  get(k,d){ try{ const v=localStorage.getItem("physio:"+k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem("physio:"+k, JSON.stringify(v)); }catch(e){} }
};
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const norm = s => String(s).replace(/‏/g,"").replace(/₂/g,"2").replace(/[\s()״"'׳.\-]/g,"").toLowerCase();

  const r=document.documentElement, b=$("#themeBtn");

/* inline question (check / predict) */
function inlineQ(q, pre){
  const box = el("div",{class:"q"+(pre?" pre":"")});
  box.append(el("span",{class:"lbl"}, pre ? "שאלת חשיבה – נסו לנחש לפני הקריאה" : "בדיקת הבנה"));
  box.append(el("p",{class:"qt"}, q.q));
  const opts = el("div",{class:"opts"}), fb = el("div",{class:"fb"});
  q.options.forEach((o,i) => {
    const b = el("button",{class:"opt",type:"button"}, o);
    b.onclick = () => {
      opts.querySelectorAll(".opt").forEach((x,j) => { x.disabled=true; if(j===q.answer) x.classList.add("right"); });
      if(i!==q.answer) b.classList.add("wrong");
      fb.innerHTML = pre ? `התשובה: <b>${q.options[q.answer]}</b>. ההסבר בהמשך.` :
        (i===q.answer ? `<strong class="ok">נכון.</strong> ` : `<strong class="no">לא מדויק.</strong> `) + (q.explain||"");
    };
    opts.append(b);
  });
  box.append(opts, fb);
  return box;
}

/* learn */
const done = new Set(store.get("done",[]));
function updateProg(){ $("#prog").style.width = (100*done.size/L.chunks.length)+"%"; }
const toc=$("#toc"), sel=$("#tocSel"), topics=$("#topics");
LESSONS.forEach((les, li) => {
  toc.append(el("h4",{}, les.name.toUpperCase()));
  const og = el("optgroup",{label:les.name}); sel.append(og);
  const head = el("div",{class:"lesson-head"}); head.append(el("span",{},`שיעור ${li+1}`), el("h2",{}, les.title)); topics.append(head);
  for(let i=les.from;i<=les.to;i++){
    const c=L.chunks[i], id="t"+i;
    const title = c.title.replace(/^שיעור \d+ · /,"");
    const a = el("a",{href:"#"+id,"data-i":i}, `<span class="dot"></span><span>${title}</span>`); if(done.has(i)) a.classList.add("done"); toc.append(a);
    og.append(el("option",{value:id}, title));
    const s = el("section",{class:"topic",id});
    const meta = el("div",{class:"meta"});
    meta.append(el("span",{class:"kind k-"+(c.kind||"text")}, KIND[c.kind||"text"]));
    const md = el("button",{class:"markdone"+(done.has(i)?" on":""),type:"button"}, done.has(i)?"✓ נלמד":"סמן כנלמד");
    md.onclick = () => { if(done.has(i)) done.delete(i); else done.add(i); store.set("done",[...done]);
      md.classList.toggle("on",done.has(i)); md.textContent = done.has(i)?"✓ נלמד":"סמן כנלמד"; a.classList.toggle("done",done.has(i)); updateProg(); };
    meta.append(md); s.append(meta, el("h3",{}, title));
    if(c.predict) s.append(inlineQ(c.predict,true));
    if(c.svg) { const f=el("figure"); f.innerHTML=c.svg; s.append(f); }
    if(c.image) { const f=el("figure"); const im=el("img",{src:c.image,alt:"טבלת סיכום מתוך החומר",loading:"lazy"}); im.onclick=()=>{ $("#lb img").src=c.image; $("#lb").classList.add("on"); }; f.append(im, el("figcaption",{},"טבלה מתוך חומר השיעור · לחצו להגדלה")); s.append(f); }
    s.append(el("div",{class:"body"}, c.body));
    if(c.example) s.append(el("div",{class:"box example"}, `<span class="lbl">דוגמה</span>${c.example}`));
    if(c.hook) s.append(el("div",{class:"box hook"}, `<span class="lbl">לזכירה</span>${c.hook}`));
    if(c.fun) s.append(el("div",{class:"box fun"}, `<span class="lbl">הערה</span>${c.fun}`));
    if(c.why) { const q=c.why.split("?"); const d=el("details",{class:"why"});
      d.append(el("summary",{}, q.length>1 ? q[0]+"?" : "למה?"), el("p",{}, q.length>1 ? q.slice(1).join("?").trim() : c.why)); s.append(d); }
    if(c.check) s.append(inlineQ(c.check,false));
    topics.append(s);
  }
});
sel.onchange = () => document.getElementById(sel.value).scrollIntoView();
$("#lb").onclick = () => $("#lb").classList.remove("on");
updateProg();
const io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){
  toc.querySelectorAll("a").forEach(a => a.classList.toggle("on", a.getAttribute("href")==="#"+e.target.id));
  sel.value = e.target.id; } }), {rootMargin:"-30% 0px -60% 0px"});
document.querySelectorAll("section.topic").forEach(s => io.observe(s));

/* flashcards */
(function(){
  const root=$("#cards"); let weak=new Set(store.get("weak",[])), deck=[], pos=0, mode="all";
  function build(){ deck = L.flashcards.map((c,i)=>i).filter(i => mode==="all" || weak.has(i)); pos=0; draw(); }
  function draw(){
    root.innerHTML="";
    const bar=el("div",{class:"fc-bar"}), g=el("div",{class:"grp"});
    const b1=el("button",{class:"btn"+(mode==="all"?" sel":""),type:"button"},`כל הכרטיסיות (${L.flashcards.length})`); b1.onclick=()=>{mode="all";build();};
    const b2=el("button",{class:"btn"+(mode==="weak"?" sel":""),type:"button"},`לחזרה (${weak.size})`); b2.onclick=()=>{mode="weak";build();};
    const b3=el("button",{class:"btn",type:"button"},"ערבב"); b3.onclick=()=>{deck=shuffle(deck);pos=0;draw();};
    g.append(b1,b2,b3); bar.append(g, el("span",{}, deck.length?`${pos+1} / ${deck.length}`:"")); root.append(bar);
    if(!deck.length){ root.append(el("p",{class:"intro"}, mode==="weak"?"אין כרטיסיות לחזרה. כרטיסייה שתסמנו \"לא בטוח\" תופיע כאן.":"")); return; }
    const c=L.flashcards[deck[pos]];
    const card=el("div",{class:"card",tabindex:"0",role:"button","aria-label":"הפוך כרטיסייה"});
    card.innerHTML=`<div class="card-in"><div class="face"><div class="t">${c.front}</div><small>לחצו להפיכה</small></div><div class="face back"><div class="t">${c.back}</div></div></div>`;
    const flip=()=>card.classList.toggle("flip"); card.onclick=flip; card.onkeydown=e=>{ if(e.key===" "||e.key==="Enter"){e.preventDefault();flip();} };
    root.append(card);
    const r=el("div",{class:"rate"});
    const prev=el("button",{class:"btn",type:"button"},"→ הקודמת"); prev.onclick=()=>{ pos=(pos-1+deck.length)%deck.length; draw(); };
    const no=el("button",{class:"btn",type:"button"},"לא בטוח – לחזרה"); no.onclick=()=>{ weak.add(deck[pos]); store.set("weak",[...weak]); next(); };
    const yes=el("button",{class:"btn primary",type:"button"},"יודע"); yes.onclick=()=>{ weak.delete(deck[pos]); store.set("weak",[...weak]); next(); };
    r.append(prev,no,yes); root.append(r);
  }
  function next(){ if(mode==="weak"){ const d=L.flashcards.map((c,i)=>i).filter(i=>weak.has(i)); if(d.length!==deck.length){ deck=d; pos=Math.min(pos,Math.max(0,deck.length-1)); draw(); return; } } pos=(pos+1)%deck.length; draw(); }
  build();
})();

/* quiz */
(function(){
  const root=$("#quiz"); let order, pos, score, wrong, answered;
  function start(){ const q=L.quiz.map((x,i)=>i); order=q.slice(0,2).concat(shuffle(q.slice(2))); pos=0; score=0; wrong=[]; draw(); }
  function finish(ok){ if(answered) return; answered=true; if(ok) score++; else wrong.push(order[pos]); const sc=document.getElementById("qzScore"); if(sc) sc.textContent=`ציון: ${score}`; }
  function draw(){
    root.innerHTML=""; answered=false;
    if(pos>=order.length){ const r=el("div",{class:"qz result"});
      r.append(el("div",{class:"big"},`${score} / ${order.length}`), el("p",{}, score/order.length>=.85?"שליטה טובה בחומר.":score/order.length>=.6?"בסיס טוב. כדאי לחזור על השאלות שבהן טעית.":"כדאי לעבור שוב על חומר הלימוד ולנסות שוב."));
      if(wrong.length){ const ul=el("ul"); wrong.forEach(i=>ul.append(el("li",{}, L.quiz[i].q || "התאמה"))); r.append(el("p",{},"<b>שאלות לחזרה:</b>"), ul); }
      const b=el("button",{class:"btn primary",type:"button"},"מבחן חדש"); b.onclick=start; r.append(b); root.append(r); return; }
    const q=L.quiz[order[pos]];
    root.append(el("div",{class:"qz-head"}, `<span>שאלה ${pos+1} מתוך ${order.length}</span><span id="qzScore">ציון: ${score}</span>`));
    const box=el("div",{class:"qz"}); box.append(el("p",{class:"qt"}, q.q || "התאימו בין הפריטים"));
    const fb=el("div",{class:"fb"}); const nav=el("div",{class:"qz-nav"});
    const nextB=el("button",{class:"btn primary",type:"button"}, pos===order.length-1?"לתוצאה":"השאלה הבאה"); nextB.onclick=()=>{ if(!answered) finish(false); pos++; draw(); };
    const explain=(ok)=>{ fb.innerHTML=(ok?`<strong class="ok">נכון.</strong> `:`<strong class="no">לא נכון.</strong> `)+(q.explain||""); };
    if(q.type==="mc"||q.type==="tf"){
      const opts=el("div",{class:"opts"}); const list = q.type==="tf"?["נכון","לא נכון"]:q.options; const ans = q.type==="tf"?(q.answer?0:1):q.answer;
      list.forEach((o,i)=>{ const b=el("button",{class:"opt",type:"button"},o); b.onclick=()=>{ if(answered) return;
        opts.querySelectorAll(".opt").forEach((x,j)=>{x.disabled=true; if(j===ans) x.classList.add("right");}); if(i!==ans) b.classList.add("wrong");
        finish(i===ans); explain(i===ans); }; opts.append(b); });
      box.append(opts);
    } else if(q.type==="fill"){
      const f=el("div",{class:"fill"}), inp=el("input",{type:"text","aria-label":"תשובה",placeholder:"הקלידו תשובה"}), b=el("button",{class:"btn",type:"button"},"בדיקה");
      const go=()=>{ if(answered||!inp.value.trim()) return; const ok=q.answers.some(a=>norm(a)===norm(inp.value)); finish(ok); inp.disabled=true;
        fb.innerHTML=(ok?`<strong class="ok">נכון.</strong> `:`<strong class="no">לא נכון.</strong> התשובה: <b>${q.answers[0]}</b>. `)+(q.explain||""); };
      b.onclick=go; inp.onkeydown=e=>{ if(e.key==="Enter") go(); }; f.append(inp,b); box.append(f);
    } else if(q.type==="match"){
      const m=el("div",{class:"match"}), rights=shuffle(q.pairs.map(p=>p[1])), sels=[];
      q.pairs.forEach(p=>{ const row=el("div",{class:"row"}), s=el("select",{"aria-label":p[0]});
        s.append(el("option",{value:""},"בחרו…")); rights.forEach(r=>s.append(el("option",{value:r},r))); sels.push(s); row.append(el("span",{},p[0]),s); m.append(row); });
      const b=el("button",{class:"btn",type:"button",style:"margin-top:12px"},"בדיקה");
      b.onclick=()=>{ if(answered) return; let ok=true; sels.forEach((s,i)=>{ const r=s.value===q.pairs[i][1]; ok=ok&&r; s.classList.add(r?"right":"wrong"); s.disabled=true; if(!r){ s.value=q.pairs[i][1]; } }); finish(ok); explain(ok); };
      box.append(m,b);
    }
    box.append(fb); nav.append(el("span"), nextB); box.append(nav); root.append(box);
  }
  start();
})();

/* summary */
(function(){
  const root=$("#summary"), s=el("div",{class:"sum"});
  s.append(el("h2",{},"נקודות עיקריות")); const ol=el("ol"); L.summary.forEach(x=>ol.append(el("li",{},x))); s.append(ol);
  if(L.teachBack){ const t=el("div",{class:"teach"}); t.append(el("h2",{},"תרגיל: הסבירו במילים שלכם"), el("p",{},L.teachBack.prompt));
    const ta=el("textarea",{"aria-label":"התשובה שלכם",placeholder:"כתבו כאן את ההסבר שלכם, ואז השוו לתשובה לדוגמה."}); ta.value=store.get("teach",""); ta.oninput=()=>store.set("teach",ta.value);
    const d=el("details",{class:"why"}); d.append(el("summary",{},"תשובה לדוגמה"), el("p",{},L.teachBack.model)); t.append(ta,d); s.append(t); }
  root.append(s);
})();
</script>
